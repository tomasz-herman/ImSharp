name: CI & NuGet Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib: libImSharpNative.so
          - os: windows-latest
            rid: win-x64
            lib: Release/ImSharpNative.dll
          - os: macos-latest
            rid: osx-arm64
            lib: libImSharpNative.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libvulkan-dev libsdl2-dev

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & Test
        run: |
          dotnet build ImSharp.sln -c Release
          dotnet test ImSharp.sln -c Release --no-build

      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p staged-runtimes/${{ matrix.rid }}/native
          cp ImSharpNative/cmake-build/${{ matrix.lib }} staged-runtimes/${{ matrix.rid }}/native/

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staged-runtimes/

  pack-and-publish:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: prebuilt-runtimes
          merge-multiple: true

      - name: Pack NuGet package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="1.93.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          dotnet pack ImSharp/ImSharp.csproj -c Release -o artifacts \
            -p:Version="$VERSION" \
            -p:PrebuiltNativeRuntimesDir="$(pwd)/prebuilt-runtimes"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v') && secrets.NUGET_API_KEY != ''
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
